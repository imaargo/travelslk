<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>mobile frames</title>
<style>
  html,body{margin:0;background:#111;font-family:monospace;color:#0f0}
  .row{display:flex;gap:10px;padding:10px}
  figure{margin:0}
  figcaption{font-size:11px;padding:4px 0}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block}
</style>
</head>
<body>
<div class="row">
  <figure><figcaption>index.html @390</figcaption><iframe src="http://localhost:4173/index.html"></iframe></figure>
  <figure><figcaption>tours.html @390</figcaption><iframe src="http://localhost:4173/tours.html"></iframe></figure>
</div>
</body>
</html>
